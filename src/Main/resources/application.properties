app.email.api-key=${BREVO_API_KEY}
app.email.sender-email=${BREVO_SENDER_EMAIL}
app.email.sender-name=${BREVO_SENDER_NAME:Gestión de Mantenimiento}
app.email.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}


# ==========================================
# CONEXIÓN A BASE DE DATOS MYSQL EN AIVEN
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
# Flyway administra el esquema; Hibernate valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Render asigna PORT al servicio web. En local se conserva el puerto habitual.
server.port=${PORT:8080}
server.address=0.0.0.0

# En local se permite Vite; en Render configurar CORS_ALLOWED_ORIGINS con el
# origen HTTPS exacto del sitio estático.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
